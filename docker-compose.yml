services:
  # Local development database. Data persists in the `db-data` volume.
  db:
    image: postgres:16-alpine
    container_name: gifted_mind_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gifted_mind_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gifted_mind_dev"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Test database. tmpfs → wiped on every container restart, and the test
  # suite runs migrations from scratch each time. Never stores real data.
  db-test:
    image: postgres:16-alpine
    container_name: gifted_mind_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gifted_mind_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gifted_mind_test"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  db-data:
